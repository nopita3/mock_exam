<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google ID Token Tester</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #14213d;
      --muted: #5c6b80;
      --accent: #0f766e;
      --accent-2: #115e59;
      --border: #d8e1ec;
      --ok-bg: #ecfdf5;
      --ok-border: #10b981;
      --ok-text: #065f46;
      --err-bg: #fff1f2;
      --err-border: #e11d48;
      --err-text: #9f1239;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 10%, #dbeafe 0%, transparent 32%),
        radial-gradient(circle at 90% 20%, #ccfbf1 0%, transparent 30%),
        radial-gradient(circle at 60% 85%, #fef3c7 0%, transparent 26%),
        var(--bg);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .card {
      width: min(860px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      padding: 22px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.5rem;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.45;
    }

    .row {
      margin-top: 16px;
      display: grid;
      gap: 10px;
    }

    label {
      font-weight: 600;
      font-size: 0.95rem;
    }

    input,
    textarea,
    button {
      font: inherit;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      background: #fff;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 0.83rem;
      line-height: 1.35;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    button:hover {
      background: var(--accent-2);
    }

    .ghost {
      background: #eef2ff;
      color: #1e293b;
    }

    .status {
      margin-top: 12px;
      border-radius: 8px;
      padding: 10px 12px;
      border: 1px solid transparent;
      font-size: 0.92rem;
    }

    .status.ok {
      background: var(--ok-bg);
      border-color: var(--ok-border);
      color: var(--ok-text);
    }

    .status.error {
      background: var(--err-bg);
      border-color: var(--err-border);
      color: var(--err-text);
    }

    .tip {
      margin-top: 14px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .tip code {
      background: #f1f5f9;
      padding: 2px 6px;
      border-radius: 6px;
      color: #1e293b;
    }
  </style>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <main class="card">
    <h1>Google ID Token Tester</h1>
    <p>Use this page to sign in and copy your Google ID token. Paste it into <strong>POST /auth/google</strong> in Swagger.</p>

    <div class="row">
      <label for="clientId">Google OAuth Client ID</label>
      <input id="clientId" type="text" placeholder="Paste your GOOGLE_CLIENT_ID" autocomplete="off">
    </div>

    <div class="actions">
      <button id="initBtn" type="button">Initialize Google Sign-In</button>
      <button id="copyBtn" type="button" class="ghost">Copy Token</button>
      <button id="clearBtn" type="button" class="ghost">Clear</button>
    </div>

    <div id="googleButton" class="row"></div>

    <div class="row">
      <label for="tokenOut">ID Token (credential)</label>
      <textarea id="tokenOut" placeholder="Your Google ID token will appear here."></textarea>
    </div>

    <div id="status" class="status" hidden></div>

    <p class="tip">
      Allowed account in your API: <code>@essence.ac.th</code> only.
    </p>
  </main>

  <script>
    const initBtn = document.getElementById("initBtn");
    const copyBtn = document.getElementById("copyBtn");
    const clearBtn = document.getElementById("clearBtn");
    const clientIdInput = document.getElementById("clientId");
    const tokenOut = document.getElementById("tokenOut");
    const googleButton = document.getElementById("googleButton");
    const statusBox = document.getElementById("status");

    function setStatus(message, type) {
      statusBox.hidden = false;
      statusBox.textContent = message;
      statusBox.className = "status " + type;
    }

    function clearStatus() {
      statusBox.hidden = true;
      statusBox.textContent = "";
      statusBox.className = "status";
    }

    function onGoogleResponse(response) {
      if (!response || !response.credential) {
        setStatus("Google did not return an ID token.", "error");
        return;
      }
      tokenOut.value = response.credential;
      setStatus("ID token received. You can now paste it into Swagger.", "ok");
    }

    initBtn.addEventListener("click", () => {
      clearStatus();
      const clientId = clientIdInput.value.trim();

      if (!clientId) {
        setStatus("Please enter your GOOGLE_CLIENT_ID first.", "error");
        return;
      }

      if (!window.google || !window.google.accounts || !window.google.accounts.id) {
        setStatus("Google script not loaded yet. Try again in a moment.", "error");
        return;
      }

      googleButton.innerHTML = "";
      window.google.accounts.id.initialize({
        client_id: clientId,
        callback: onGoogleResponse,
        auto_select: false,
        cancel_on_tap_outside: true
      });

      window.google.accounts.id.renderButton(googleButton, {
        type: "standard",
        shape: "pill",
        theme: "outline",
        text: "signin_with",
        size: "large",
        logo_alignment: "left"
      });

      setStatus("Google Sign-In initialized. Click the button below.", "ok");
    });

    copyBtn.addEventListener("click", async () => {
      clearStatus();
      const value = tokenOut.value.trim();
      if (!value) {
        setStatus("No token to copy.", "error");
        return;
      }

      try {
        await navigator.clipboard.writeText(value);
        setStatus("Token copied to clipboard.", "ok");
      } catch (error) {
        setStatus("Clipboard copy failed. Copy manually from the textbox.", "error");
      }
    });

    clearBtn.addEventListener("click", () => {
      tokenOut.value = "";
      clearStatus();
    });
  </script>
</body>
</html>
